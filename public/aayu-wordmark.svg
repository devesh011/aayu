<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">The word Aayu with bordered, grain-textured, hand-sketched letters, a very small bar above the top of A, a leaf tilted at an angle with the same sketch texture and a visible wind trail beside it above the blank second letter a, and a bar above the joined letters yu</desc>
